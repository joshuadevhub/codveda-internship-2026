<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bright Future Academy | Home</title>

    <link rel="stylesheet" href="./styles/style.css" />

    <script src="./scripts/nav-toggle.js" defer></script>
  </head>

  <body>
    <div class="overlay"></div>
    <header class="header">
      <div class="logo">
        <a href="#">Bright Future Academy</a>
      </div>

      <button
        class="menu-toggle"
        aria-expanded="false"
        aria-label="Open navigation menu"
        aria-controls="primary-navigation"
        id="menu-toggle"
      >
        <img src="./images/icons/menu-hambugger.svg" alt="Button" />
      </button>

      <nav class="nav" id="primary-navigation">
        <button
          class="close-toggle"
          aria-expanded="true"
          aria-label="Close navigation menu"
          aria-controls="primary-navigation"
          id="close-toggle"
        >
          <img src="./images/icons/close-icon.svg" alt="Button" />
        </button>
        <ul>
          <li class="active"><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Academics</a></li>
          <li><a href="#">Admission</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-content">
          <h1>Inspiring Minds. Shaping Futures.</h1>
          <p>
            A nurturing environment where students learn, grow, and thrive as
            they prepare to become tomorrow's leaders
          </p>
          <div class="cta">
            <a href="#">Discover Our School</a>
            <a href="#">Apply For Admission</a>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
